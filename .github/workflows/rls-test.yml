name: RLS Isolation Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'prisma/schema.prisma'
      - 'migrations/**'
      - 'lib/auth.ts'
      - 'lib/rls-store.ts'
      - 'lib/prisma.ts'

jobs:
  rls-test:
    name: RLS Cross-Org Isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medicamentum360
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medicamentum360"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medicamentum360
        run: npx prisma migrate deploy
      - name: Seed test data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medicamentum360
        run: npx tsx tests/rls-seed.ts
      - name: Run RLS isolation test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medicamentum360
        run: psql -U postgres -d medicamentum360 -f tests/rls-isolation-test.sql
