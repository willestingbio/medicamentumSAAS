# docker/docker-compose.yml — Entorno LOCAL de pruebas Medicamentum360 ↔ Moodle
services:
  mariadb:
    image: docker.io/library/mariadb:11
    container_name: m360-moodle-mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=medicamentum360_root
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=medicamentum360_moodle
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-pmedicamentum360_root"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  moodle:
    image: docker.io/jhardison/moodle:latest
    container_name: m360-moodle
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - MOODLE_URL=http://localhost:8090
      - MOODLE_DB_HOST=mariadb
      - MOODLE_DB_PORT=3306
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASSWORD=medicamentum360_moodle
      - MOODLE_DB_NAME=moodle
      - MOODLE_ADMIN_USER=admin
      - MOODLE_ADMIN_PASSWORD=Adm1nM360Test#2026
      - MOODLE_ADMIN_EMAIL=admin@medicamentum360.local
      - MOODLE_SITE_NAME=Medicamentum360 LMS (local)
      - MOODLE_LANG=es
      - MOODLE_DATA_DIR=/var/www/moodledata
    ports:
      - "8090:80"
    volumes:
      - moodle_data:/var/www/moodledata
      - ./moodle-bootstrap.php:/tmp/moodle-bootstrap.php:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/login/index.php"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped

  moodle-bootstrap:
    image: docker.io/jhardison/moodle:latest
    container_name: m360-moodle-bootstrap
    depends_on:
      moodle:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "sleep 30 &&
       echo '[moodle-bootstrap] Iniciando provisioning...' &&
       php /tmp/moodle-bootstrap.php"
    volumes:
      - moodle_data:/var/www/moodledata
      - ./moodle-bootstrap.php:/tmp/moodle-bootstrap.php:ro
      - ./output:/output
      - ./config.php:/var/www/html/config.php:ro
    restart: "no"

volumes:
  mariadb_data:
  moodle_data:
